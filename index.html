<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Heart Archive is a calm online archive of accidental heart shapes found in the world."
    />
    <title>The Heart Archive</title>
    <link rel="stylesheet" href="./src/styles.css?v=2026-07-18-share-clean" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="#/">The Heart Archive</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#/">Archive</a>
        <a href="#/submit">Share</a>
        <a href="#/about">About</a>
        <a class="hidden" href="#/moderation" data-review-link>Review</a>
        <a href="#/auth/submit" data-account-link data-account-surface="header">
          Sign in
        </a>
      </nav>
    </header>

    <main id="main" class="app-shell" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-divider" aria-hidden="true">
        <span>♥ ♥ ♥</span>
      </div>
      <div class="footer-inner">
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="#/">Archive</a>
          <a href="#/submit">Share</a>
          <a href="#/about">About</a>
          <a href="#/auth/submit" data-account-link data-account-surface="footer">
            Sign in
          </a>
        </nav>
        <p class="footer-title">The Heart Archive</p>
        <p>For Love and Friendship</p>
        <span class="footer-heart" aria-hidden="true">♥</span>
        <p>Created by <span>Batta &amp; Wazza</span></p>
        <p>&copy; 2026 The Heart Archive</p>
      </div>
    </footer>

    <template id="archive-template">
      <section class="archive-hero" aria-labelledby="archive-title">
        <aside class="hero-preview" aria-labelledby="preview-title">
          <div class="preview-heading">
            <h2 id="preview-title">Latest Discoveries</h2>
          </div>
          <div class="preview-strip">
            <div class="preview-grid" data-featured-grid></div>
          </div>
          <div class="preview-empty" data-featured-empty>
            <p>Approved hearts will appear here as the archive begins to grow.</p>
          </div>
        </aside>

        <div class="hero-copy">
          <p class="kicker">The Heart Archive</p>
          <h1 id="archive-title">Love leaves traces everywhere.</h1>
          <p class="hero-lede">
            People around the world collect these tiny moments of wonder and
            share them here.
          </p>
          <p class="hero-note">
            Every photograph was discovered by someone who simply looked a
            little closer.
          </p>
          <div class="hero-actions">
            <button class="button quiet" type="button" data-scroll-gallery>
              Browse the Archive <span class="button-icon" aria-hidden="true">→</span>
            </button>
            <a class="button secondary" href="#/submit">
              <span class="button-icon" aria-hidden="true">♥</span> Share a Heart
            </a>
          </div>
        </div>
      </section>

      <section class="map-section" aria-labelledby="map-title">
        <div class="map-layout">
          <div class="map-heading">
            <p class="kicker">Found around the world</p>
            <h2 id="map-title">Magical hearts, showing up everywhere.</h2>
            <p>
              Every marker is someone stopping for a second and thinking,
              wait, that looks like a heart!
            </p>
            <div class="map-cta">
              <p>Seen one?</p>
              <a class="button primary" href="#/submit">
                <span class="button-icon" aria-hidden="true">♥</span> Share a Heart
              </a>
            </div>
          </div>

          <figure class="world-map">
            <img
              src="./assets/temporary-heart-map.png?v=2026-07-15-6"
              alt="Watercolor world map with red heart markers in several cities."
            />
          </figure>
        </div>

      </section>

      <section id="archive" class="archive-section" aria-labelledby="gallery-title">
        <div class="section-heading">
          <div>
            <p class="kicker">Archive</p>
            <h2 id="gallery-title">Recently added</h2>
          </div>
          <p class="archive-count" data-archive-count></p>
        </div>

        <div class="heart-grid" data-heart-grid></div>
        <div class="empty-state hidden" data-empty-archive>
          <p>No hearts here yet.</p>
          <a class="button secondary" href="#/submit">
            <span class="button-icon" aria-hidden="true">♥</span> Share a Heart
          </a>
        </div>
      </section>

      <section class="why-section invitation-section" aria-labelledby="why-title">
        <div class="invitation-layout">
          <div class="invitation-copy">
            <p class="kicker">An invitation to notice</p>
            <h2 id="why-title">Seen one lately?</h2>
            <p>
              Maybe in a cloud. A coffee stain. A shadow on the wall.
              If it made you pause, it belongs here.
            </p>
            <div class="hero-actions">
              <a class="button primary" href="#/submit">
                <span class="button-icon" aria-hidden="true">♥</span> Share a Heart
              </a>
              <button class="button secondary" type="button" data-scroll-gallery>
                Browse the Archive <span class="button-icon" aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </template>

    <template id="detail-template">
      <section class="detail-page" data-detail-page></section>
    </template>

    <template id="submit-template">
      <section class="submit-page" aria-labelledby="submit-title">
        <div class="form-intro">
          <h1 id="submit-title">Every heart adds a little more love to the archive!</h1>
        </div>

        <form class="submission-form" data-submission-form>
          <div class="share-step photo-step" role="group" aria-label="Upload a photo">
            <label class="upload-box">
              <span class="upload-prompt" data-upload-prompt>
                <span class="upload-heart" aria-hidden="true">&#9829;</span>
                <strong>Upload a photo</strong>
                <small>JPG, PNG, WebP, and iPhone photos are welcome.</small>
              </span>
              <img class="upload-preview hidden" alt="Selected heart" data-upload-preview />
              <input
                type="file"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif"
                name="image"
                required
              />
            </label>
          </div>

          <div class="share-step" role="group" aria-labelledby="location-step-title">
            <div class="step-heading">
              <span class="step-number" aria-hidden="true">2</span>
              <h2 id="location-step-title">Where did you find it?</h2>
            </div>
            <label>
              <span class="visually-hidden">Location</span>
              <input
                name="location"
                maxlength="80"
                placeholder="Boston, USA"
                autocomplete="address-level2"
                required
              />
            </label>
          </div>

          <div class="share-step" role="group" aria-labelledby="story-step-title">
            <div class="step-heading">
              <span class="step-number" aria-hidden="true">3</span>
              <h2 id="story-step-title">Tell us more!</h2>
            </div>
            <div class="form-grid story-fields">
              <label>
                <span>Title</span>
                <input
                  name="title"
                  maxlength="80"
                  placeholder="A heart after the rain"
                  required
                />
              </label>

              <label>
                <span>Note <em>optional</em></span>
                <textarea
                  name="note"
                  rows="4"
                  maxlength="240"
                  placeholder="What made you stop and notice?"
                ></textarea>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button class="button primary" type="submit">
              <span class="button-icon" aria-hidden="true">♥</span> Add to the Archive
            </button>
          </div>
          <p class="sharing-promise">
            All contributions are anonymous. Your heart will be reviewed before
            being displayed in the public archive.
          </p>
          <p class="form-status" data-form-status role="status"></p>
        </form>
      </section>
    </template>

    <template id="confirmation-template">
      <section class="confirmation-page" aria-labelledby="confirmation-title">
        <span class="confirmation-heart" aria-hidden="true">♥</span>
        <p class="kicker">Heart received</p>
        <h1 id="confirmation-title">Thank you for looking closer.</h1>
        <p>
          Your photo is safely with us. We'll look at it with care, and once it
          is approved, it will become part of the archive for someone else to
          discover.
        </p>
        <div class="hero-actions">
          <a class="button primary" href="#/">
            Browse the Archive <span class="button-icon" aria-hidden="true">→</span>
          </a>
          <a class="button secondary" href="#/submit">
            <span class="button-icon" aria-hidden="true">♥</span> Share Another
          </a>
        </div>
      </section>
    </template>

    <template id="auth-template">
      <section class="auth-page" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="kicker">Account</p>
          <h1 id="auth-title">Sign in to share a heart.</h1>
          <p>
            The archive stays anonymous. Your email is only used so the review
            room knows each shared heart came from a real person.
          </p>

          <div class="auth-switch" aria-label="Account mode">
            <button type="button" data-auth-mode="signin">Sign in</button>
            <button type="button" data-auth-mode="signup">Create account</button>
          </div>

          <form class="auth-form" data-auth-form>
            <label>
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Password</span>
              <input
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                required
              />
            </label>
            <button class="button primary" type="submit">Sign in</button>
            <p class="form-status" data-auth-status role="status"></p>
          </form>
        </div>
      </section>
    </template>

    <template id="about-template">
      <section class="about-page" aria-labelledby="about-title">
        <div class="about-panel">
          <p class="kicker">About</p>
          <h1 id="about-title">A promise to notice love everywhere.</h1>
          <div class="about-copy">
            <p>
              I started The Heart Archive because I believe we need to regain
              the ability to appreciate the small quiet things.
            </p>
            <p>
              To look closer. To have our attention directed not to the big and
              loud events, but to the subtle details the world is always leaving
              around us. To see love in ordinary places, and pass that feeling
              on.
            </p>
            <p>
              It began with my friend Wazza, who used to send me pictures of
              every heart she noticed. She called it her heart archive. I
              promised her I would build a real one.
            </p>
          </div>
          <p class="about-invitation">Please share your precious lovely findings :)</p>
          <a class="button primary" href="#/submit">
            <span class="button-icon" aria-hidden="true">♥</span> Share a Heart
          </a>
        </div>
      </section>
    </template>

    <template id="moderation-template">
      <section class="moderation-page" aria-labelledby="moderation-title">
        <div class="dashboard-hero">
          <div>
            <p class="kicker">Archive studio</p>
            <h1 id="moderation-title">Today in the archive</h1>
            <p>
              Review what arrived, keep the collection intentional, and help
              small moments find their way into the world.
            </p>
            <div class="archive-pulse" aria-label="Archive status">
              <span class="live-dot" aria-hidden="true"></span>
              <span>Live</span>
              <span class="pulse-line" aria-hidden="true"></span>
              <span data-live-stamp></span>
            </div>
          </div>
          <div class="dashboard-actions">
            <span data-staff-label></span>
            <a class="button secondary" href="#/">
              Browse the Archive <span class="button-icon" aria-hidden="true">→</span>
            </a>
            <button class="button secondary" type="button" data-sign-out>
              Sign out
            </button>
          </div>
        </div>

        <div class="dashboard-stats" data-dashboard-stats></div>

        <div class="studio-layout">
          <section class="review-spotlight" aria-labelledby="spotlight-title">
            <div class="studio-section-heading">
              <div>
                <p class="kicker">Review spotlight</p>
                <h2 id="spotlight-title"><span aria-hidden="true">◇</span> Next heart</h2>
              </div>
              <span data-spotlight-count></span>
            </div>
            <div data-spotlight-heart></div>
            <p class="empty-state hidden" data-empty-review>
              The review queue is clear. Nothing needs your attention right now.
            </p>
          </section>

          <aside class="studio-sidebar">
            <section class="queue-panel" aria-labelledby="queue-title">
              <div class="studio-section-heading compact">
                <h2 id="queue-title"><span aria-hidden="true">⌁</span> Queue</h2>
                <span data-queue-count></span>
              </div>
              <div class="review-list" data-review-list></div>
            </section>

            <section class="activity-panel" aria-labelledby="activity-title">
              <div class="studio-section-heading compact">
                <h2 id="activity-title"><span aria-hidden="true">↳</span> Recent care</h2>
              </div>
              <div class="decision-list" data-decision-list></div>
              <p class="empty-state hidden" data-empty-decisions>
                No decisions yet.
              </p>
            </section>
          </aside>
        </div>

        <section class="dashboard-note" aria-label="Dashboard note">
          <p>
            Good systems protect the mood. Review slowly, approve generously,
            and keep the archive true to what it is.
          </p>
        </section>
      </section>
    </template>

    <template id="access-denied-template">
      <section class="auth-page" aria-labelledby="access-denied-title">
        <div class="auth-card">
          <p class="kicker">Private room</p>
          <h1 id="access-denied-title">This part is for the archive team.</h1>
          <p>
            You are signed in, but this account is not set as an admin or
            project assistant yet.
          </p>
          <div class="hero-actions">
            <a class="button primary" href="#/">
              Browse the Archive <span class="button-icon" aria-hidden="true">→</span>
            </a>
            <button class="button secondary" type="button" data-denied-sign-out>
              Sign out
            </button>
          </div>
        </div>
      </section>
    </template>

    <script defer src="./src/app.js?v=2026-07-18-share-final-action"></script>
  </body>
</html>
